<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Música</title>
</head>
<body>
  <h1>Sistema de Música</h1>

  <h2>Register</h2>
  <form id="formularioRegistro">
    <input type="email" id="emailRegistro" placeholder="Email" required>
    <input type="password" id="senhaRegistro" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <h2>Login</h2>
  <form id="formularioLogin">
    <input type="email" id="emailLogin" placeholder="Email" required>
    <input type="password" id="senhaLogin" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <h2>Musicas</h2>
  <button id="btnObterMusicas">Obter Musicas</button>
  <ul id="listaMusicas"></ul>

  <script src="script.js"></script>
</body>
</html>
